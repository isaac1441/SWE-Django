{% extends 'app/base.html' %}

{% block content %}
<div class="container" style="max-width: 600px; margin-top: 20px;">
    <h2>Create Post</h2>
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Post</button>
    </form>
</div>
{% endblock %}
