<style>
    .navbar {
        background: #1a1a1b;
        border-bottom: 1px solid #343536;
        padding: 12px 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        position: sticky;
        top: 0;
        z-index: 100;
    }

    .logo {
        font-size: 24px;
        font-weight: bold;
        color: #7f22cc;
        text-decoration: none;
    }

    .nav-left {
        display: flex;
        align-items: center;
        gap: 20px;
    }

    .search-bar {
        flex: 1;
        max-width: 500px;
        margin: 0 20px;
    }

    .search-bar input {
        width: 100%;
        padding: 10px 16px;
        background: #272729;
        border: 1px solid #343536;
        border-radius: 20px;
        color: #d7dadc;
        font-size: 14px;
    }

    .search-bar input:focus {
        outline: none;
        border-color: #d7dadc;
    }

    .nav-buttons {
        display: flex;
        gap: 12px;
        align-items: center;
    }

    .btn-create {
        background: #7f22cc;
        color: white;
        padding: 8px 20px;
        border: none;
        border-radius: 20px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
    }

    .btn-create:hover {
        background: #9333ea;
    }

    .nav-icon-btn {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: transparent;
        border: 1px solid #343536;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.2s;
        font-size: 18px;
        color: #d7dadc;
    }

    .nav-icon-btn:hover {
        background: #272729;
        border-color: #d7dadc;
    }

    .profile-avatar {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: linear-gradient(135deg, #7c3aed, #a855f7);
        cursor: pointer;
        transition: all 0.2s;
        border: 2px solid transparent;
    }

    .profile-avatar:hover {
        border-color: #d7dadc;
    }

    @media (max-width: 768px) {
        .search-bar {
            display: none;
        }

        .btn-create span {
            display: none;
        }

        .btn-create::before {
            content: '+';
            font-size: 20px;
        }
    }
</style>

<nav class="navbar">
    <div class="nav-left">
        <a href="/" class="logo">NodeLink</a>
    </div>
    <div class="search-bar">
        <input type="text" placeholder="Search posts...">
    </div>
    <div class="nav-buttons">
        {% if user.is_authenticated %}
            <form action="{% url 'logout' %}" method="post">
                {% csrf_token %}
                <button class="btn btn-secondary" type="submit">Logout</button>
            </form>
            
            <button class="btn-create" type="button" onclick="showForm()"><span style="font-weight: 1;">+</span></button>
            <button class="nav-icon-btn" title="Home">🏠</button>
            <button class="nav-icon-btn" title="Messages">💬</button>
            <div class="profile-avatar" href="{% url 'profile' %}" title="Profile"></div>
        {% else %}
                {% csrf_token %}
                <button class="btn btn-primary" type="submit">Sign up</button>
            </form>
             <form action="{% url 'login' %}" method="post">
                {% csrf_token %}
                <button class="btn btn-secondary" type="submit">Log in</button>
            </form>
        {% endif %}
    </div>
</nav>

<script>
    function showForm() {
        const form = document.getElementById('post-form');
        
        if (form.style.display === 'block') {
            form.style.display = 'none';
        } else {
            form.style.display = 'block';
        }
    }
</script>
