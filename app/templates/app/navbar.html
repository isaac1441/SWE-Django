<style>
    .navbar {
        background: #1a1a1b;
        border-bottom: 1px solid #343536;
        padding: 12px 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        position: sticky;
        top: 0;
        z-index: 100;
    }

    .logo {
        font-size: 24px;
        font-weight: bold;
        color: #7f22cc;
        text-decoration: none;
    }

    .nav-left {
        display: flex;
        align-items: center;
        gap: 20px;
    }

    .search-bar {
        flex: 1;
        max-width: 500px;
        margin: 0 20px;
    }

    .search-bar input {
        width: 100%;
        padding: 10px 16px;
        background: #272729;
        border: 1px solid #343536;
        border-radius: 20px;
        color: #d7dadc;
        font-size: 14px;
    }

    .search-bar input:focus {
        outline: none;
        border-color: #d7dadc;
    }

    .nav-buttons {
        display: flex;
        gap: 12px;
        align-items: center;
    }

    .btn-create {
        background: #7f22cc;
        color: white;
        padding: 8px 20px;
        border: none;
        border-radius: 20px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 40px;
        line-height: 1;
    }

    .btn-create:hover {
        background: #9333ea;
    }

    .nav-icon-link {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: transparent;
        border: 1px solid #343536;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.2s;
        font-size: 18px;
        color: #d7dadc;
        text-decoration: none;
    }

    .nav-icon-link:hover {
        background: #272729;
        border-color: #d7dadc;
    }

    .profile-avatar-link {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: linear-gradient(135deg, #7c3aed, #a855f7);
        cursor: pointer;
        transition: all 0.2s;
        border: 2px solid transparent;
        display: inline-block;
        text-decoration: none;
    }

    .profile-avatar-link:hover {
        border-color: #d7dadc;
    }

    @media (max-width: 768px) {
        .search-bar {
            display: none;
        }

        .btn-create span {
            display: none;
        }

        .btn-create::before {
            content: '+';
            font-size: 20px;
        }
    }
</style>

<nav class="navbar">
    <div class="nav-left">
        <a href="/" class="logo">NodeLink</a>
    </div>

    <div class="search-bar">
        <input type="text" placeholder="Search posts...">
    </div>

    <div class="nav-buttons">
        {% if user.is_authenticated %}

            <a href="/" class="nav-icon-link" title="Home">🏠</a>

            {# Create Post #}
            <a href="{% url 'add_post' %}" class="btn-create" title="Create Post">
                <span style="font-weight: 1;">+</span>
            </a>

            {# Messages Inbox (DMs) #}
            <a href="{% url 'messaging:inbox' %}" class="nav-icon-link" title="Messages">💬</a>

            {# Profile (adjust this URL name if yours is different) #}
            <a href="{% url 'profile' user.username %}" class="profile-avatar-link" title="Profile"></a>

            {# Logout should be POST #}
            <form action="{% url 'logout' %}" method="post" style="margin: 0;">
                {% csrf_token %}
                <button class="btn btn-secondary" type="submit">Logout</button>
            </form>

        {% else %}

            <a href="{% url 'signup' %}" class="nav-icon-link" title="Sign up">📝</a>
            <a href="{% url 'login' %}" class="nav-icon-link" title="Log in">🔑</a>

        {% endif %}
    </div>
</nav>
