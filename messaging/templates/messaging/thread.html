{% extends "app/base.html" %}
{% block content %}
<div class="container mt-4">
  <h2>Chat with {{ other_user.username }}</h2>

  <div class="border rounded p-3 mt-3" style="height: 50vh; overflow-y: auto;">
    {% for m in messages %}
      <div class="mb-2">
        <strong>{{ m.sender.username }}:</strong> {{ m.body }}
        <div class="text-muted" style="font-size: 0.8rem;">{{ m.created_at }}</div>
      </div>
    {% empty %}
      <p class="text-muted">Say hi 👋</p>
    {% endfor %}
  </div>

  <form method="post" class="mt-3">
    {% csrf_token %}
    <div class="input-group">
      <input type="text" name="body" class="form-control" placeholder="Type a message..." autocomplete="off">
      <button class="btn btn-primary" type="submit">Send</button>
    </div>
  </form>

  <div class="mt-3">
    <a href="{% url 'messaging:inbox' %}">← Back to inbox</a>
  </div>
</div>
{% endblock %}
